[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "blearn"
authors = [
    {name = "Daniel Fosas", email = "d.fosas@ed.ac.uk"},
]
dependencies = [
    "arrow",
    "fire",
    "numpy",
    "pandas >1.1",
    "xlsxwriter",
    "parse",
    "tabulate",
    "xlwings",
]
requires-python = ">=3.12"
readme = "README.md"
classifiers = [ "License :: OSI Approved :: MIT License",]
dynamic = ["version", "description"]

[project.urls]
Home = "https://github.com/dfosas/blearn"

[project.optional-dependencies]
test = [
    "black",
    "flake8",
    "flake8-bugbear",
    "flake8-pyproject",
    "mypy",
    "pylint",
    "pytest >=7.0",
    "pytest-cov",
]
doc = ["sphinx"]

[project.scripts]
blearn-grader = "blearn.grader:cli"
blearn-anon_grader = "blearn.anon_grader:cli"
blearn-anon_mapping = "blearn.anon_mapping:cli"

[tool.black]
line-length = 88

[tool.flake8]
# Check that this is aligned with your other tools like Black
max-line-length = 88
exclude = [
    ".git",
    "__pycache__"
]
extend-ignore = ["E501"]

[tool.mypy]
ignore_missing_imports = true
allow_redefinition = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --doctest-modules --cov --cov-append --cov-report xml"
testpaths = [
    "bp_learn",
    "tests",
]
